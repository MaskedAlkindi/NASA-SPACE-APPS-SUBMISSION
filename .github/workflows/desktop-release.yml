# Builds the HEALTH-01 Electron desktop app and attaches it to a GitHub release.
# Trigger: push a tag like v1.0.0 (git tag v1.0.0 && git push origin v1.0.0),
# or run it by hand from the Actions tab with a tag name.
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: HEALTH-01 desktop ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
