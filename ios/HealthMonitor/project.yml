# Fallback: regenerate HealthMonitor.xcodeproj with XcodeGen if needed
#   brew install xcodegen && cd ios/HealthMonitor && xcodegen generate
name: HEALTH-01
options:
  bundleIdPrefix: org.spaceapps
  deploymentTarget:
    iOS: "17.0"
targets:
  HEALTH-01:
    type: application
    platform: iOS
    sources:
      - path: HealthMonitor
        excludes: ["Info.plist", "HealthMonitor.entitlements"]
    entitlements:
      path: HealthMonitor/HealthMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.spaceapps.healthmonitor
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HealthMonitor/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "HEALTH-01"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "HEALTH-01 reads only the health types you individually allow (heart rate, resting heart rate, HRV, blood pressure, body temperature, blood glucose, body mass, sleep, steps, exercise) and uploads daily summaries to your HEALTH-01 server for personal-baseline monitoring."
        INFOPLIST_KEY_NSCameraUsageDescription: "HEALTH-01 uses the camera to count exercise repetitions on this phone. Video is analysed on the device and never stored or uploaded."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "HEALTH-01 does not write data to Apple Health."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "HEALTH-01 connects to your HEALTH-01 server on the local network."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
