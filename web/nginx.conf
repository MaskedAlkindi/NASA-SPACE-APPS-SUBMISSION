server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API + WebSocket proxy to the FastAPI container
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
}
