# Serious edition. The site password is off for this public demo, so /app opens with the rest of the site.
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location = /unlock.html { add_header Cache-Control "no-store"; }
  location = /logo.png { }
  location = /healthz { access_log off; return 200 "ok\n"; }

  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
  location = /app { try_files /index.html =404; }
  location /app/ { try_files /index.html =404; }
  location / { try_files $uri /index.html; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
